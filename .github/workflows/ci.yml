name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_skill.py SKILL.md
      - run: |
          for file in examples/*.yaml; do
            python scripts/validate_artifact.py "$file"
          done
